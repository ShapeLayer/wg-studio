<section data-panel-view hidden id="name-dialog">
  <form>
    <h2><span data-i18n="fileName">파일 이름</span></h2>
    <label
      ><span data-i18n="name">이름</span
      ><input id="filename" required pattern="[^/\\]+" autocomplete="off"
    /></label>
    <div class="dialog-actions">
      <button value="cancel" class="secondary">
        <span data-i18n="cancel">취소</span></button
      ><button value="ok" class="primary">
        <span data-i18n="confirm">확인</span>
      </button>
    </div>
  </form>
</section>
