<section data-panel-view hidden id="confirm-dialog">
  <form>
    <h2 id="confirm-title">
      <span data-i18n="discardChanges">변경 사항을 버릴까요?</span>
    </h2>
    <p id="confirm-message">
      <span data-i18n="thereAreUnsavedChanges"
        >저장하지 않은 변경 사항이 있습니다.</span
      >
    </p>
    <div class="dialog-actions">
      <button value="cancel" class="secondary">
        <span data-i18n="cancel">취소</span></button
      ><button value="ok" class="primary">
        <span data-i18n="continue">계속</span>
      </button>
    </div>
  </form>
</section>
