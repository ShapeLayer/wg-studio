<section
  data-panel-view
  hidden
  id="export-dialog"
  aria-labelledby="export-title"
>
  <div class="dialog-heading">
    <h2 id="export-title">
      <span data-i18n="exportConfigurations">설정 내보내기</span>
    </h2>
    <button
      id="export-close"
      class="icon"
      aria-label="내보내기 닫기"
      data-i18n-aria-label="closeExport"
    >
      ×
    </button>
  </div>
  <p class="export-description">
    <span data-i18n="chooseAFormatForEachConfigurationQrCodesAre"
      >설정마다 저장할 형식을 선택하세요. QR코드는 SVG 이미지로, 선택한 파일은
      하나의 ZIP으로 저장됩니다.</span
    >
  </p>
  <div class="export-list-heading" aria-hidden="true">
    <span><span data-i18n="openConfigurations">열린 설정</span></span
    ><span><span data-i18n="exportFormat">내보내기 형식</span></span>
  </div>
  <div
    id="export-list"
    aria-label="열린 설정 목록"
    data-i18n-aria-label="openConfigurationList"
  ></div>
  <p id="export-error" role="alert"></p>
  <div class="export-footer">
    <span id="export-summary" role="status"></span
    ><button id="export-save" class="primary">
      <span data-i18n="save2">저장하기</span>
    </button>
  </div>
</section>
