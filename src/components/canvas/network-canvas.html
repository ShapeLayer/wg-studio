<section
  id="canvas"
  aria-label="설정 캔버스"
  data-i18n-aria-label="configurationCanvas"
  tabindex="0"
>
  <div id="canvas-world">
    <div id="canvas-content">
      <svg
        id="connections"
        aria-label="공개키 연결 관계"
        data-i18n-aria-label="publicKeyConnections"
      ></svg>
      <div id="canvas-cards"></div>
    </div>
  </div>
  <p class="canvas-notice">
    <span data-i18n="thisEditorIsHostedByGithubPagesAndDoes"
      >이 편집기는 GitHub Pages에 의해 호스팅되며, 서버에 데이터를 저장하지
      않습니다. 자세한 내용은</span
    >
    <a
      href="https://github.com/shapelayer/wg-studio"
      target="_blank"
      rel="noopener noreferrer"
      ><span data-i18n="repository">저장소</span></a
    ><span data-i18n="sentenceEnd">를 확인하세요.</span>
  </p>
</section>
<div
  class="canvas-toolbar"
  aria-label="캔버스 보기 도구"
  data-i18n-aria-label="canvasViewControls"
>
  <button id="zoom-out" aria-label="축소" data-i18n-aria-label="zoomOut">
    −</button
  ><button
    id="zoom-reset"
    aria-label="확대 비율 초기화"
    data-i18n-aria-label="resetZoom"
  >
    100%</button
  ><button id="zoom-in" aria-label="확대" data-i18n-aria-label="zoomIn">
    ＋</button
  ><span class="tool-divider"></span
  ><button
    id="fit-canvas"
    aria-label="전체 설정 보기"
    data-i18n-aria-label="fitAllConfigurations"
  >
    <span data-i18n="fitAll">전체 보기</span>
  </button>
</div>
